<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Panel kontrolny</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 40px;
    height: 100vh;
    background: #111;
    font-family: Arial Black, sans-serif;
  }

  /* --- ekran PIN --- */
  #pin-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
  }
  #pin-screen h1 { color: #888; font-size: 1rem; letter-spacing: 0.2em; text-transform: uppercase; }
  #pin-dots {
    display: flex;
    gap: 16px;
  }
  .dot {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #333;
    transition: background 0.15s;
  }
  .dot.filled { background: #fff; }
  #pin-pad {
    display: grid;
    grid-template-columns: repeat(3, 80px);
    gap: 12px;
  }
  #pin-pad button {
    width: 80px;
    height: 80px;
    font-size: 1.6rem;
    font-weight: 900;
    background: #222;
    color: #fff;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.1s, transform 0.1s;
  }
  #pin-pad button:active { background: #444; transform: scale(0.93); }
  #pin-error { color: #ff1744; font-size: 0.85rem; letter-spacing: 0.1em; min-height: 1em; }

  /* --- ekran tokena --- */
  #token-screen {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 24px;
  }
  #token-screen h1 { color: #888; font-size: 1rem; letter-spacing: 0.2em; text-transform: uppercase; }
  #token-screen p { color: #555; font-size: 0.75rem; text-align: center; max-width: 300px; line-height: 1.5; font-family: Arial, sans-serif; }
  #token-input {
    width: 300px;
    padding: 14px;
    background: #222;
    color: #fff;
    border: 1px solid #444;
    border-radius: 12px;
    font-size: 0.85rem;
    font-family: monospace;
    text-align: center;
  }
  #token-input::placeholder { color: #555; }
  #token-submit {
    width: 300px;
    padding: 14px;
    background: #333;
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 900;
    cursor: pointer;
    transition: background 0.1s;
    font-family: Arial Black, sans-serif;
  }
  #token-submit:active { background: #555; }
  #token-error { color: #ff1744; font-size: 0.85rem; min-height: 1em; }

  /* --- ekran główny --- */
  #main-screen { display: none; flex-direction: column; align-items: center; gap: 40px; }
  h1 { color: #888; font-size: 1.2rem; letter-spacing: 0.2em; text-transform: uppercase; }
  .buttons { display: flex; gap: 30px; }
  button.big {
    width: 200px;
    height: 200px;
    font-size: 2.5rem;
    font-weight: 900;
    border: none;
    border-radius: 16px;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.1s;
  }
  button.big:active { transform: scale(0.95); }
  button.big:disabled { opacity: 0.4; cursor: default; }
  #btn-pass  { background: #00e676; color: #001a00; }
  #btn-close { background: #ff1744; color: #1a0000; }
  #current { font-size: 1rem; color: #666; letter-spacing: 0.1em; }
  #current span { color: #fff; font-weight: bold; }
  #save-status { font-size: 0.8rem; color: #555; min-height: 1em; font-family: Arial, sans-serif; }
</style>
</head>
<body>

<!-- EKRAN PIN -->
<div id="pin-screen">
  <h1>Wpisz PIN</h1>
  <div id="pin-dots">
    <div class="dot" id="d0"></div>
    <div class="dot" id="d1"></div>
    <div class="dot" id="d2"></div>
    <div class="dot" id="d3"></div>
  </div>
  <div id="pin-pad">
    <button onclick="pinPress('1')">1</button>
    <button onclick="pinPress('2')">2</button>
    <button onclick="pinPress('3')">3</button>
    <button onclick="pinPress('4')">4</button>
    <button onclick="pinPress('5')">5</button>
    <button onclick="pinPress('6')">6</button>
    <button onclick="pinPress('7')">7</button>
    <button onclick="pinPress('8')">8</button>
    <button onclick="pinPress('9')">9</button>
    <button onclick="pinClear()" style="font-size:1rem;">CLR</button>
    <button onclick="pinPress('0')">0</button>
    <button style="background:#111; cursor:default;"></button>
  </div>
  <div id="pin-error"></div>
</div>

<!-- EKRAN TOKEN -->
<div id="token-screen">
  <h1>GitHub Token</h1>
  <p>Wygeneruj Fine-grained token z uprawnieniem<br><strong style="color:#aaa">Contents: Read and Write</strong><br>dla repozytorium <strong style="color:#aaa">gatekeeper</strong>.<br>Token jest przechowywany tylko w pamięci przeglądarki.</p>
  <input id="token-input" type="password" placeholder="github_pat_..." autocomplete="off" />
  <button id="token-submit" onclick="saveToken()">ZATWIERDŹ</button>
  <div id="token-error"></div>
</div>

<!-- EKRAN GŁÓWNY -->
<div id="main-screen">
  <h1>Panel kontrolny</h1>
  <div class="buttons">
    <button class="big" id="btn-pass"  onclick="setState('PASS')">PASS</button>
    <button class="big" id="btn-close" onclick="setState('CLOSE')">CLOSE</button>
  </div>
  <div id="current">Aktualny stan: <span id="stateLabel">—</span></div>
  <div id="save-status"></div>
</div>

<script>
  const CORRECT_PIN = "1234";
  const REPO_OWNER  = "mikeisfree";
  const REPO_NAME   = "gatekeeper";
  const FILE_PATH   = "status.json";

  // --- logika PIN ---
  let entered = "";

  function pinPress(digit) {
    if (entered.length >= CORRECT_PIN.length) return;
    entered += digit;
    updateDots();
    if (entered.length === CORRECT_PIN.length) checkPin();
  }

  function pinClear() {
    entered = "";
    updateDots();
    document.getElementById("pin-error").textContent = "";
  }

  function updateDots() {
    for (let i = 0; i < CORRECT_PIN.length; i++) {
      document.getElementById("d" + i).classList.toggle("filled", i < entered.length);
    }
  }

  function checkPin() {
    if (entered === CORRECT_PIN) {
      document.getElementById("pin-screen").style.display = "none";
      const token = sessionStorage.getItem("gh_token");
      if (token) {
        showMain(token);
      } else {
        document.getElementById("token-screen").style.display = "flex";
      }
    } else {
      document.getElementById("pin-error").textContent = "Nieprawidłowy PIN";
      setTimeout(pinClear, 600);
    }
  }

  // --- logika tokena ---
  async function saveToken() {
    const token = document.getElementById("token-input").value.trim();
    if (!token) return;
    document.getElementById("token-error").textContent = "";

    // verify token works
    const resp = await fetch(
      `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`,
      { headers: { Authorization: "token " + token } }
    );
    if (!resp.ok) {
      document.getElementById("token-error").textContent = "Token nieprawidłowy lub brak uprawnień.";
      return;
    }

    sessionStorage.setItem("gh_token", token);
    document.getElementById("token-screen").style.display = "none";
    showMain(token);
  }

  document.getElementById("token-input").addEventListener("keydown", e => {
    if (e.key === "Enter") saveToken();
  });

  // --- ekran główny ---
  async function showMain(token) {
    document.getElementById("main-screen").style.display = "flex";
    await getState(token);
  }

  async function getState(token) {
    const t = token || sessionStorage.getItem("gh_token");
    const resp = await fetch(
      `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`,
      { headers: { Authorization: "token " + t } }
    );
    const file = await resp.json();
    const data = JSON.parse(atob(file.content));
    document.getElementById("stateLabel").textContent = data.state;
  }

  async function setState(val) {
    const token = sessionStorage.getItem("gh_token");
    const btns = document.querySelectorAll("button.big");
    btns.forEach(b => b.disabled = true);
    const statusEl = document.getElementById("save-status");
    statusEl.textContent = "Zapisywanie...";

    try {
      // get current SHA
      const getResp = await fetch(
        `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`,
        { headers: { Authorization: "token " + token } }
      );
      const file = await getResp.json();

      // update file
      await fetch(
        `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`,
        {
          method: "PUT",
          headers: {
            Authorization: "token " + token,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: "state: " + val,
            content: btoa('{"state":"' + val + '"}\n'),
            sha: file.sha
          })
        }
      );

      document.getElementById("stateLabel").textContent = val;
      statusEl.textContent = "Zapisano.";
      setTimeout(() => { statusEl.textContent = ""; }, 2000);
    } catch(e) {
      statusEl.textContent = "Błąd zapisu.";
    } finally {
      btns.forEach(b => b.disabled = false);
    }
  }
</script>
</body>
</html>
