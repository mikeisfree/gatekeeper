<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta http-equiv="refresh" content="5">
<title>Status</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #000;
    font-family: Arial Black, sans-serif;
  }
  #status {
    font-size: 20vw;
    font-weight: 900;
    letter-spacing: 0.05em;
  }
  .PASS  { color: #00e676; }
  .CLOSE { color: #ff1744; }
</style>
</head>
<body>
<div id="status">...</div>
<script>
  // ⬇️ WKLEJ TUTAJ URL swojego Apps Script (Web App)
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbynhChMYCZ2N-41Cpy3V_LETLLI-P3cGaXySETJhoX_VD2oTIdqN8rywW-8jgR3xZpd/exec";

  function fetchJSONP(url) {
    return new Promise((resolve, reject) => {
      const cb = '_cb' + Date.now();
      const s = document.createElement('script');
      window[cb] = (data) => { delete window[cb]; s.remove(); resolve(data); };
      s.onerror = () => { delete window[cb]; s.remove(); reject(new Error('err')); };
      s.src = url + '&callback=' + cb;
      document.head.appendChild(s);
    });
  }

  async function update() {
    try {
      const data = await fetchJSONP(SCRIPT_URL + "?action=get");
      const el = document.getElementById("status");
      el.textContent = data.state;
      el.className = data.state;
      document.body.style.background = data.state === "PASS" ? "#001a00" : "#1a0000";
    } catch(e) {
      document.getElementById("status").textContent = "ERR";
    }
  }
  update();
</script>
</body>
</html>
