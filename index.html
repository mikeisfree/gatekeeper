<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta http-equiv="refresh" content="5">
<title>Status</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #000;
    font-family: Arial Black, sans-serif;
  }
  #status {
    font-size: 20vw;
    font-weight: 900;
    letter-spacing: 0.05em;
  }
  .PASS  { color: #00e676; }
  .CLOSE { color: #ff1744; }
</style>
</head>
<body>
<div id="status">...</div>
<script>
  const STATUS_URL = "https://raw.githubusercontent.com/mikeisfree/gatekeeper/main/status.json";

  async function update() {
    try {
      const r = await fetch(STATUS_URL + "?t=" + Date.now());
      const data = await r.json();
      const el = document.getElementById("status");
      el.textContent = data.state;
      el.className = data.state;
      document.body.style.background = data.state === "PASS" ? "#001a00" : "#1a0000";
    } catch(e) {
      document.getElementById("status").textContent = "ERR";
    }
  }
  update();
</script>
</body>
</html>
